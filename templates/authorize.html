<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DID Authentication</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 520px; margin: 60px auto; padding: 0 20px; }
        h1 { font-size: 1.4em; }
        code { background: #f4f4f4; padding: 8px 12px; display: block; word-break: break-all; border-radius: 4px; }
        label { display: block; margin-top: 16px; font-weight: 600; }
        input, textarea { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; font-family: monospace; }
        textarea { height: 80px; resize: vertical; }
        button { margin-top: 20px; padding: 10px 24px; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1em; }
        button:hover { background: #1d4ed8; }
        .hint { color: #666; font-size: 0.85em; margin-top: 4px; }
    </style>
</head>
<body>
    <h1>DID Authentication</h1>
    <p>Sign the challenge below with your DID private key to authenticate.</p>

    <label>Challenge nonce:</label>
    <code>{{ challenge }}</code>

    <form method="POST" action="/authorize/callback">
        <input type="hidden" name="state" value="{{ state }}">

        <label for="did">Your DID</label>
        <input type="text" id="did" name="did" placeholder="did:key:z6Mk..." required>
        <p class="hint">Supported: did:key (Ed25519)</p>

        <label for="signature">Signature</label>
        <textarea id="signature" name="signature" placeholder="Hex-encoded Ed25519 signature of the challenge nonce" required></textarea>
        <p class="hint">Sign the exact challenge nonce bytes (UTF-8) with your Ed25519 private key.</p>

        <button type="submit">Authenticate</button>
    </form>
</body>
</html>
