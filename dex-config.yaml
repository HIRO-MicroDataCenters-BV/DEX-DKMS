# Example DEX configuration using DKMS bridge as upstream OIDC provider.
#
# Prerequisites:
#   1. Start the DKMS infrastructure (witnesses, watcher, mesagkesto):
#      cd dkms-demo && docker-compose up -d
#   2. Start the DKMS-DEX bridge:
#      python bridge.py
#   3. Start DEX with this config:
#      dex serve dex-config.yaml

issuer: http://localhost:5556/dex

storage:
  type: sqlite3
  config:
    file: dex.db

web:
  http: 0.0.0.0:5556

connectors:
  - type: oidc
    id: dkms
    name: "DKMS (KERI Auth)"
    config:
      issuer: http://localhost:8900
      clientID: dex-client
      clientSecret: dex-secret
      redirectURI: http://localhost:5556/dex/callback
      getUserInfo: true
      insecureEnableGroups: false
      scopes:
        - openid
        - profile
        - email

staticClients:
  - id: example-app
    redirectURIs:
      - http://localhost:5555/callback
    name: "Example App"
    secret: example-app-secret
